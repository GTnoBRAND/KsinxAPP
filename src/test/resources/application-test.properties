spring.application.name=KsinxAPP-test

# Hibernate creates a clean schema per test run; Testcontainers handles connections via @ServiceConnection
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tests build the schema with Hibernate (create-drop), so Flyway is disabled here
spring.flyway.enabled=false

# JWT — fixed test secret (32+ bytes, base64) and short expiration to make expiry tests fast
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbHV0b3JsbXMtdGVzdHMtMjAyNi0=
jwt.expiration=3600000

# Skip the admin bootstrap so tests start with an empty users table
app.admin.email=
app.admin.password=

# OAuth2 client registrations are required for SecurityConfig to start; values are dummies
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Disable Spring caching during tests so @Cacheable doesn't mask real service behavior
spring.cache.type=none

# File uploads
file.upload-dir=build/test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PayPal — dummies (PaymentService/Controller tests are intentionally skipped)
paypal.client.id=test-client
paypal.client.secret=test-secret
paypal.mode=sandbox

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
