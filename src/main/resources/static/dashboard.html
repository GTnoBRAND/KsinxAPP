<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LutorLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="LutorLMS" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand"><div class="logo-dot"></div>LutorLMS</a>
  <ul class="navbar-nav"><li><a href="/index.html#courses">Courses</a></li></ul>
  <div class="navbar-actions" id="navbar-actions"></div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Student</div>
      <div class="sidebar-item active" data-tab="overview"><span class="sidebar-icon">🏠</span> Overview</div>
      <div class="sidebar-item" data-tab="my-courses"><span class="sidebar-icon">📚</span> My Courses</div>
      <a href="/submissions.html" class="sidebar-item"><span class="sidebar-icon">✅</span> Submissions</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Explore</div>
      <a class="sidebar-item" href="/index.html#courses"><span class="sidebar-icon">🔍</span> Browse Courses</a>
    </div>
  </aside>

  <main class="dashboard-main">

    <!-- Overview Tab -->
    <div id="tab-overview" class="tab-panel active">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="welcome-msg">Welcome back!</h1>
          <p class="page-subtitle">Here's your learning snapshot</p>
        </div>
        <a href="/index.html#courses" class="btn btn-primary btn-sm">+ Enroll in a Course</a>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div><div class="stat-card-value" id="stat-enrolled">—</div><div class="stat-card-label">Enrolled</div></div><div class="stat-card-icon green">📚</div></div>
        <div class="stat-card"><div><div class="stat-card-value" id="stat-active">—</div><div class="stat-card-label">Active</div></div><div class="stat-card-icon blue">⚡</div></div>
        <div class="stat-card"><div><div class="stat-card-value">0</div><div class="stat-card-label">Completed</div></div><div class="stat-card-icon orange">🏆</div></div>
        <div class="stat-card"><div><div class="stat-card-value">—</div><div class="stat-card-label">Avg Score</div></div><div class="stat-card-icon green">⭐</div></div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <span class="table-title">My Enrolled Courses</span>
          <a href="/index.html#courses" class="btn btn-outline btn-sm">Browse More</a>
        </div>
        <div id="overview-courses">
          <div class="loading-overlay"><div class="spinner"></div><span>Loading…</span></div>
        </div>
      </div>
    </div>

    <!-- My Courses Tab -->
    <div id="tab-my-courses" class="tab-panel">
      <div class="page-header">
        <div>
          <h1 class="page-title">My Courses</h1>
          <p class="page-subtitle">All courses you're enrolled in</p>
        </div>
      </div>
      <div id="enrolled-grid" class="enrolled-grid">
        <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
    </div>

  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  var session = Auth.requireAuth(['STUDENT','ADMIN','TEACHER']);
  if (!session) throw new Error('redirect');

  Auth.initNavUser();
  document.getElementById('welcome-msg').textContent = 'Welcome back, ' + session.user.fullName.split(' ')[0] + '!';

  var enrollments = [];

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function fmtDate(dt) {
    if (!dt) return '—';
    return new Date(dt).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  // Sidebar tabs
  document.querySelectorAll('.sidebar-item[data-tab]').forEach(function(item) {
    item.addEventListener('click', function() {
      document.querySelectorAll('.sidebar-item').forEach(function(i){ i.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      item.classList.add('active');
      var panel = document.getElementById('tab-' + item.dataset.tab);
      if (panel) panel.classList.add('active');
    });
  });

  api.enrollments.my().then(function(data) {
    enrollments = data || [];

    document.getElementById('stat-enrolled').textContent = enrollments.length;
    document.getElementById('stat-active').textContent   = enrollments.filter(function(e){ return e.courseActive; }).length;

    renderOverviewCourses();
    renderEnrolledGrid();
  }).catch(function(e) {
    console.error('Failed to load enrollments:', e.message);
    document.getElementById('stat-enrolled').textContent = '0';
    document.getElementById('stat-active').textContent   = '0';
    UI.renderEmpty(document.getElementById('overview-courses'), '📭', 'No enrollments yet', 'Browse courses and enroll to get started.');
    UI.renderEmpty(document.getElementById('enrolled-grid'),  '📦', 'No courses yet', 'Start learning by browsing our catalog.');
  });

  function renderOverviewCourses() {
    var el = document.getElementById('overview-courses');
    if (!enrollments.length) {
      UI.renderEmpty(el, '📭', 'No enrollments yet', 'Browse courses and enroll to get started.');
      return;
    }
    el.innerHTML =
      '<div class="table-responsive"><table>' +
        '<thead><tr><th>Course</th><th>Enrolled</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead>' +
        '<tbody>' +
          enrollments.map(function(e) {
            var pct = Math.round(e.completionPercentage);
            return '<tr>' +
              '<td><strong>' + esc(e.courseTitle) + '</strong></td>' +
              '<td>' + fmtDate(e.enrollmentDate) + '</td>' +
              '<td>' +
                '<div style="display:flex;align-items:center;gap:8px">' +
                  '<div class="progress-bar-wrap" style="flex:1;min-width:80px"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
                  '<span style="white-space:nowrap;font-size:12px;color:var(--text-muted)">' + e.totalCompletedTasks + '/' + e.totalTasks + ' (' + pct + '%)</span>' +
                '</div>' +
              '</td>' +
              '<td><span class="badge ' + (e.courseActive ? 'badge-success' : 'badge-muted') + '">' + (e.courseActive ? 'Active' : 'Inactive') + '</span></td>' +
              '<td><a href="/course.html?id=' + e.courseId + '" class="btn btn-ghost btn-sm">Continue →</a></td>' +
            '</tr>';
          }).join('') +
        '</tbody>' +
      '</table></div>';
  }

  function renderEnrolledGrid() {
    var el = document.getElementById('enrolled-grid');
    if (!enrollments.length) {
      UI.renderEmpty(el, '📦', 'No courses yet', 'Start learning by browsing our catalog.');
      return;
    }
    el.innerHTML = enrollments.map(function(e) {
      var pct = Math.round(e.completionPercentage);
      return '<a href="/course.html?id=' + e.courseId + '" class="enrolled-card">' +
        '<div class="enrolled-card-header">' + UI.courseEmoji(e.courseId) + '</div>' +
        '<div class="enrolled-card-body">' +
          '<div class="enrolled-card-title">' + esc(e.courseTitle) + '</div>' +
          '<div class="enrolled-card-meta">Enrolled ' + fmtDate(e.enrollmentDate) + '</div>' +
          '<div class="enrolled-card-meta" style="margin-top:2px">' + e.totalCompletedTasks + ' of ' + e.totalTasks + ' tasks completed</div>' +
          '<div class="progress-bar-wrap" style="margin-top:8px"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
          '<div style="text-align:right;font-size:11px;color:var(--text-muted);margin-top:2px">' + pct + '%</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }
</script>
</body>
</html>
