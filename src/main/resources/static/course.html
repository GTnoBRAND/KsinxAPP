<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course — LutorLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand"><div class="logo-dot"></div>LutorLMS</a>
  <ul class="navbar-nav"><li><a href="/index.html#courses">Courses</a></li></ul>
  <div class="navbar-actions" id="navbar-actions"></div>
</nav>

<div class="course-detail-header">
  <div class="container">
    <nav class="breadcrumb">
      <a href="/index.html">Home</a><span class="sep">›</span>
      <a href="/index.html#courses">Courses</a><span class="sep">›</span>
      <span id="breadcrumb-title">Loading…</span>
    </nav>
    <div class="course-detail-grid">
      <div id="header-content">
        <div class="loading-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div></div>
      </div>
      <div>
        <div class="enroll-card" id="enroll-card" style="display:none">
          <div class="enroll-price" id="enroll-price"></div>
          <button class="btn btn-primary enroll-btn" id="enroll-btn">Enroll Now</button>
          <ul class="enroll-features">
            <li>Full lifetime access</li>
            <li>All video modules included</li>
            <li>Graded assignments &amp; feedback</li>
            <li>Certificate of completion</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section-sm" style="background:var(--bg-primary)">
  <div class="container" style="max-width:820px">
    <div class="modules-section">
      <h2>Course Modules</h2>
      <div id="modules-list">
        <div class="loading-overlay"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div><span>Loading modules…</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Enroll Modal -->
<div class="modal-overlay" id="enroll-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Confirm Enrollment</h3>
      <button class="modal-close" onclick="UI.closeModal('enroll-modal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);margin-bottom:16px">You're about to enroll in <strong id="modal-course-title"></strong>.</p>
      <div id="modal-price-info"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.closeModal('enroll-modal')">Cancel</button>
      <button class="btn btn-primary" id="confirm-enroll-btn">Confirm Enrollment</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  Auth.initNavUser();

  var params   = new URLSearchParams(window.location.search);
  var courseId = params.get('id');
  if (!courseId) window.location.href = '/index.html';

  var course = null;

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  api.courses.find(courseId).then(function(c) {
    course = c;
    document.title = c.title + ' — LutorLMS';
    document.getElementById('breadcrumb-title').textContent = c.title;

    var price = c.price && c.price > 0 ? '$' + Number(c.price).toFixed(2) : 'Free';

    document.getElementById('header-content').innerHTML =
      (c.imageUrl
        ? '<img src="' + esc(c.imageUrl) + '" alt="' + esc(c.title) + '" style="width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-bottom:18px" />'
        : '') +
      '<h1 class="course-detail-title">' + esc(c.title) + '</h1>' +
      '<p class="course-detail-desc">' + esc(c.description || 'No description provided.') + '</p>' +
      (c.videoUrl
        ? '<div style="margin:18px 0">' +
            '<div style="font-weight:700;margin-bottom:8px">🎬 Course Preview</div>' +
            '<video src="' + esc(c.videoUrl) + '" controls style="width:100%;max-height:420px;border-radius:12px;background:#000"></video>' +
          '</div>'
        : '') +
      '<div class="course-tags">' +
        '<span class="tag">📦 ' + (c.totalModules || 0) + ' Modules</span>' +
        '<span class="tag">⏱ Self-paced</span>' +
        '<span class="tag">🌐 Online</span>' +
        (c.price && c.price > 0 ? '<span class="tag">💳 Premium</span>' : '<span class="tag">✨ Free</span>') +
      '</div>';

    document.getElementById('enroll-price').textContent = price;
    document.getElementById('enroll-card').style.display = 'block';
    document.getElementById('enroll-btn').onclick = openEnrollModal;

    return api.modules.byCourse(courseId);
  }).then(function(modules) {
    var list = document.getElementById('modules-list');
    if (!modules || !modules.length) {
      UI.renderEmpty(list, '📭', 'No modules yet', 'Modules will appear here once the instructor adds them.');
      return;
    }
    list.innerHTML = modules
      .sort(function(a,b){ return a.sequenceOrder - b.sequenceOrder; })
      .map(function(m, i) {
        return '<div class="module-item" id="mod-' + m.id + '">' +
          '<div class="module-header" onclick="toggleMod(' + m.id + ')">' +
            '<div class="module-header-left">' +
              '<div class="module-number">' + (m.sequenceOrder || (i+1)) + '</div>' +
              '<span class="module-title">' + esc(m.title) + '</span>' +
            '</div>' +
            '<span class="module-chevron">▾</span>' +
          '</div>' +
          '<div class="module-body">' +
            (m.videoUrl
              ? '<div style="margin-bottom:12px"><a href="' + esc(m.videoUrl) + '" target="_blank" class="btn btn-ghost btn-sm" style="color:var(--accent)">▶ Watch Video</a></div>'
              : '<p style="font-size:.85rem;color:var(--text-muted)">No video available for this module yet.</p>') +
            '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'/tasks.html?moduleId=' + m.id + '&courseId=' + courseId + '\'">View Tasks</button>' +
          '</div>' +
        '</div>';
      }).join('');
  }).catch(function(e) {
    document.getElementById('header-content').innerHTML = '<p style="color:var(--danger)">Failed to load course: ' + esc(e.message) + '</p>';
  });

  function toggleMod(id) {
    var el = document.getElementById('mod-' + id);
    if (el) el.classList.toggle('open');
  }

  function openEnrollModal() {
    if (!Auth.getSession()) { window.location.href = '/login.html'; return; }
    document.getElementById('modal-course-title').textContent = course ? course.title : '';
    var price = course && course.price && course.price > 0 ? '$' + Number(course.price).toFixed(2) : 'Free';
    document.getElementById('modal-price-info').innerHTML = (course && course.price && course.price > 0)
      ? '<div style="background:var(--accent-glow);border:1px solid var(--border-accent);border-radius:8px;padding:12px 16px;color:var(--accent);font-weight:700">Price: ' + price + '</div>'
      : '<div style="background:rgba(0,214,143,.1);border:1px solid rgba(0,214,143,.3);border-radius:8px;padding:12px 16px;color:var(--success);font-weight:700">This course is FREE!</div>';
    UI.openModal('enroll-modal');
  }

  document.getElementById('confirm-enroll-btn').addEventListener('click', function() {
    var s = Auth.getSession();
    if (!s) { window.location.href = '/login.html'; return; }
    var btn = document.getElementById('confirm-enroll-btn');
    UI.setLoading(btn, true);
    api.enrollments.enroll({ userId: s.user.id, courseId: Number(courseId) }).then(function() {
      UI.toast('Successfully enrolled!', 'success');
      UI.closeModal('enroll-modal');
      setTimeout(function() { window.location.href = '/dashboard.html'; }, 1000);
    }).catch(function(e) {
      UI.toast(e.message || 'Enrollment failed', 'error');
      UI.setLoading(btn, false);
    });
  });
</script>
</body>
</html>
