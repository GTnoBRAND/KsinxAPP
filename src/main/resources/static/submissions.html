<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Submissions — LutorLMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* ─── SUBMISSION-SPECIFIC STYLES ───────────────────────────── */
        .submission-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            align-items: center;
        }

        .filter-chip {
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .filter-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-chip.active {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 214, 143, 0.2);
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .submission-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .submission-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0, 214, 143, 0.12);
        }

        .submission-card-header {
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 214, 143, 0.08) 0%, rgba(77, 166, 255, 0.05) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .submission-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .submission-card-course {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .submission-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-graded {
            background: rgba(0, 214, 143, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 214, 143, 0.3);
        }

        .status-ungraded {
            background: rgba(255, 179, 71, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 179, 71, 0.3);
        }

        .submission-card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .submission-meta {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .submission-meta-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .submission-meta-label {
            color: var(--text-muted);
        }

        .submission-meta-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .submission-feedback-preview {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-top: 12px;
        }

        .submission-action {
            margin-top: 16px;
        }

        .submission-action .btn {
            width: 100%;
        }

        /* ─── MODAL STYLES ─────────────────────────────────────── */
        .feedback-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .feedback-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .feedback-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .feedback-modal-header {
            padding: 28px;
            background: linear-gradient(135deg, rgba(0, 214, 143, 0.1) 0%, rgba(77, 166, 255, 0.05) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .feedback-modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .feedback-modal-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .feedback-modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .feedback-modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .feedback-modal-body {
            padding: 28px;
        }

        .feedback-section {
            margin-bottom: 28px;
        }

        .feedback-section:last-child {
            margin-bottom: 0;
        }

        .feedback-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .feedback-score-display {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .score-big {
            font-size: 3.6rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
        }

        .score-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-info-item {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .feedback-content {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            line-height: 1.8;
            font-size: 0.9rem;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .feedback-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .feedback-empty-icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-item-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .meta-item-value {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .submissions-grid {
                grid-template-columns: 1fr;
            }

            .feedback-modal-content {
                max-height: 95vh;
                border-radius: var(--radius);
            }

            .submission-filters {
                overflow-x: auto;
                padding-bottom: 8px;
            }

            .filter-chip {
                flex-shrink: 0;
            }

            .score-big {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/index.html" class="navbar-brand"><div class="logo-dot"></div>LutorLMS</a>
    <ul class="navbar-nav"><li><a href="/dashboard.html">Dashboard</a></li></ul>
    <div class="navbar-actions" id="navbar-actions"></div>
</nav>

<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Student</div>
            <a href="/dashboard.html" class="sidebar-item"><span class="sidebar-icon">🏠</span> Overview</a>
            <a href="/dashboard.html" class="sidebar-item"><span class="sidebar-icon">📚</span> My Courses</a>
            <div class="sidebar-item active"><span class="sidebar-icon">✅</span> Submissions</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-label">Explore</div>
            <a class="sidebar-item" href="/index.html#courses"><span class="sidebar-icon">🔍</span> Browse Courses</a>
        </div>
    </aside>

    <main class="dashboard-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">My Submissions</h1>
                <p class="page-subtitle">Track all your task submissions, grades, and feedback</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="submission-filters">
            <button class="filter-chip active" data-filter="all">All Submissions</button>
            <button class="filter-chip" data-filter="graded">✓ Graded</button>
            <button class="filter-chip" data-filter="ungraded">⏳ Pending</button>
        </div>

        <!-- Submissions Grid -->
        <div class="submissions-grid" id="submissions-container">
            <div class="loading-overlay" style="grid-column:1/-1">
                <div class="spinner"></div>
                <span>Loading your submissions…</span>
            </div>
        </div>

    </main>
</div>

<!-- Feedback Modal -->
<div class="feedback-modal" id="feedback-modal">
    <div class="feedback-modal-content">
        <div class="feedback-modal-header">
            <div>
                <div class="feedback-modal-title" id="feedback-title">Task Submission</div>
                <div class="feedback-modal-subtitle" id="feedback-subtitle">Course Name</div>
            </div>
            <button class="feedback-modal-close" onclick="closeFeedback()">✕</button>
        </div>
        <div class="feedback-modal-body" id="feedback-body">
            <!-- Content loaded dynamically -->
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>

<script>
    var session = Auth.requireAuth(['STUDENT', 'ADMIN', 'TEACHER']);
    if (!session) throw new Error('redirect');

    Auth.initNavUser();

    var allSubmissions = [];
    var currentFilter = 'all';

    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function fmtDate(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function fmtTime(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    // Load submissions on page load
    function loadSubmissions() {
        var container = document.getElementById('submissions-container');
        container.innerHTML = '<div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div><span>Loading submissions…</span></div>';

        api.submissions.mine()
            .then(function(list) {
                allSubmissions = list || [];
                renderSubmissions();
            })
            .catch(function(err) {
                console.error('Failed to load submissions:', err.message);
                container.innerHTML = '';
                renderEmptyState();
            });
    }

    function renderEmptyState() {
        var container = document.getElementById('submissions-container');
        container.innerHTML =
            '<div style="grid-column:1/-1">' +
            '<div class="empty-state">' +
            '<div class="empty-state-icon">📭</div>' +
            '<div class="empty-state-title">No submissions yet</div>' +
            '<div class="empty-state-subtitle">Once you submit tasks, they\'ll appear here with grades and feedback from your instructors.</div>' +
            '</div>' +
            '</div>';
    }

    function renderSubmissions() {
        var container = document.getElementById('submissions-container');
        var filtered = allSubmissions;

        if (currentFilter === 'graded') {
            filtered = allSubmissions.filter(function(s) { return s.score !== null; });
        } else if (currentFilter === 'ungraded') {
            filtered = allSubmissions.filter(function(s) { return s.score === null; });
        }

        if (!filtered.length) {
            container.innerHTML = '<div style="grid-column:1/-1"><div class="empty-state">' +
                '<div class="empty-state-icon">🔍</div>' +
                '<div class="empty-state-title">No submissions match filter</div>' +
                '<div class="empty-state-subtitle">Try adjusting your filters or submit new tasks.</div>' +
                '</div></div>';
            return;
        }

        container.innerHTML = filtered.map(function(sub) {
            var isGraded = sub.score !== null;
            var statusClass = isGraded ? 'status-graded' : 'status-ungraded';
            var statusText = isGraded ? '✓ Graded' : '⏳ Pending';
            var submittedDate = fmtDate(sub.submittedAt);

            return '<div class="submission-card" onclick="openFeedback(' + sub.id + ')">' +
                '<div class="submission-card-header">' +
                '<div>' +
                '<div class="submission-card-title">' + esc(sub.taskTitle) + '</div>' +
                '<div class="submission-card-course">' + esc(sub.studentFullName) + '</div>' +
                '</div>' +
                '<span class="submission-status ' + statusClass + '">' + statusText + '</span>' +
                '</div>' +
                '<div class="submission-card-body">' +
                '<div class="submission-meta">' +
                '<div class="submission-meta-item">' +
                '<span class="submission-meta-label">Submitted</span>' +
                '<span class="submission-meta-value">' + submittedDate + '</span>' +
                '</div>' +
                (isGraded ? '<div class="submission-meta-item">' +
                    '<span class="submission-meta-label">Score</span>' +
                    '<span class="submission-meta-value" style="color:var(--accent);font-size:1.1rem">' + sub.score + '/100</span>' +
                    '</div>' : '') +
                '</div>' +
                (isGraded && sub.teacherFeedback ? '<div class="submission-feedback-preview">' +
                    esc(sub.teacherFeedback) +
                    '</div>' : (isGraded ? '<div class="submission-feedback-preview" style="color:var(--text-muted);font-style:italic">No feedback provided</div>' : '')) +
                '<div class="submission-action">' +
                '<button class="btn btn-primary btn-sm" style="width:100%">View Details →</button>' +
                '</div>' +
                '</div>' +
                '</div>';
        }).join('');
    }

    function openFeedback(submissionId) {
        var sub = allSubmissions.find(function(s) { return s.id === submissionId; });
        if (!sub) return;

        var isGraded = sub.score !== null;
        var modal = document.getElementById('feedback-modal');
        var body = document.getElementById('feedback-body');

        document.getElementById('feedback-title').textContent = esc(sub.taskTitle);
        document.getElementById('feedback-subtitle').textContent = 'Submitted by ' + esc(sub.studentFullName);

        var html = '<div class="meta-grid">' +
            '<div class="meta-item">' +
            '<span class="meta-item-label">Task</span>' +
            '<span class="meta-item-value">' + esc(sub.taskTitle) + '</span>' +
            '</div>' +
            '<div class="meta-item">' +
            '<span class="meta-item-label">Submitted</span>' +
            '<span class="meta-item-value">' + fmtDate(sub.submittedAt) + '</span>' +
            '</div>' +
            '<div class="meta-item">' +
            '<span class="meta-item-label">Status</span>' +
            '<span class="meta-item-value" style="color:' + (isGraded ? 'var(--accent)' : 'var(--warning)') + '">' + (isGraded ? '✓ Graded' : '⏳ Pending') + '</span>' +
            '</div>' +
            '</div>';

        if (isGraded) {
            html += '<div class="feedback-section">' +
                '<span class="feedback-label">Your Score</span>' +
                '<div class="feedback-score-display">' +
                '<div class="score-big">' + sub.score + '</div>' +
                '<div class="score-info">' +
                '<div class="score-info-item">out of 100</div>' +
                '<div class="score-info-item" style="font-size:0.75rem;color:var(--text-muted)">Performance metric</div>' +
                '</div>' +
                '</div>' +
                '</div>';

            if (sub.teacherFeedback) {
                html += '<div class="feedback-section">' +
                    '<span class="feedback-label">Instructor Feedback</span>' +
                    '<div class="feedback-content">' + esc(sub.teacherFeedback) + '</div>' +
                    '</div>';
            } else {
                html += '<div class="feedback-section">' +
                    '<div class="feedback-empty">' +
                    '<div class="feedback-empty-icon">💬</div>' +
                    '<p style="margin:0">No written feedback provided</p>' +
                    '</div>' +
                    '</div>';
            }
        } else {
            html += '<div class="feedback-section">' +
                '<div class="feedback-empty">' +
                '<div class="feedback-empty-icon">⏳</div>' +
                '<p style="margin:0;font-weight:600">This submission is pending review</p>' +
                '<p style="margin:8px 0 0;font-size:0.85rem;color:var(--text-muted)">Your instructor will review and provide feedback soon. Check back later!</p>' +
                '</div>' +
                '</div>';
        }

        body.innerHTML = html;
        modal.classList.add('active');
    }

    function closeFeedback() {
        document.getElementById('feedback-modal').classList.remove('active');
    }

    // Filter buttons
    document.querySelectorAll('.filter-chip').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-chip').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderSubmissions();
        });
    });

    // Close modal on background click
    document.getElementById('feedback-modal').addEventListener('click', function(e) {
        if (e.target === this) closeFeedback();
    });

    // Load data on page load
    loadSubmissions();
</script>

</body>
</html>
