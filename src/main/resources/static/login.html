<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — LutorLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="LutorLMS" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand"><div class="logo-dot"></div>LutorLMS</a>
  <div></div>
  <div>
    <span style="font-size:.875rem;color:var(--text-muted)">Don't have an account?</span>
    <a href="/register.html" class="btn btn-primary btn-sm" style="margin-left:12px">Sign Up</a>
  </div>
</nav>

<main class="auth-page">
  <div class="bg-glow"></div>
  <div class="auth-card">
    <div class="auth-logo"><div class="logo-dot"></div>LutorLMS</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to continue your learning journey</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <div class="form-error" id="err-name">Please enter your email</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" placeholder="••••••••" required />
        <div class="form-error" id="err-pass">Please enter your password</div>
      </div>
      <div id="login-error" style="background:rgba(255,77,77,.12);border:1px solid rgba(255,77,77,.3);border-radius:8px;padding:10px 14px;font-size:.85rem;color:var(--danger);margin-bottom:16px;display:none"></div>
      <button type="submit" class="btn btn-primary form-submit" id="login-btn">Log In</button>
    </form>

    <div class="form-divider">or</div>
    <a href="/oauth2/authorization/google" class="oauth-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </a>
    <div class="auth-footer">New to LutorLMS? <a href="/register.html">Create an account</a></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  // Redirect if already logged in
  (function() {
    var s = Auth.getSession();
    if (s) {
      if (s.user.role === 'ADMIN') window.location.href = '/admin.html';
      else if (s.user.role === 'TEACHER') window.location.href = '/teacher.html';
      else window.location.href = '/dashboard.html';
    }
  })();

  var form   = document.getElementById('login-form');
  var btn    = document.getElementById('login-btn');
  var errBox = document.getElementById('login-error');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    errBox.style.display = 'none';

    var valid = true;
    if (!email) { document.getElementById('err-name').classList.add('show'); valid = false; }
    else document.getElementById('err-name').classList.remove('show');
    if (!password) { document.getElementById('err-pass').classList.add('show'); valid = false; }
    else document.getElementById('err-pass').classList.remove('show');
    if (!valid) return;

    UI.setLoading(btn, true);
    api.auth.login({ email: email, password: password }).then(function(res) {
      Auth.saveSession(res.token, { id: res.id, fullName: res.fullName, role: res.role });
      UI.toast('Login successful! Redirecting…', 'success');
      setTimeout(function() {
        if (res.role === 'ADMIN') window.location.href = '/admin.html';
        else if (res.role === 'TEACHER') window.location.href = '/teacher.html';
        else window.location.href = '/dashboard.html';
      }, 600);
    }).catch(function(err) {
      var msg = err.message || 'Invalid credentials. Please try again.';
      errBox.innerHTML = msg.replace(/[<>&]/g, function(c) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
      });
      if (/verify your email/i.test(msg)) {
        errBox.innerHTML += ' <a href="/register.html" style="color:inherit;text-decoration:underline;font-weight:600">Resend link</a>';
      }
      errBox.style.display = 'block';
      UI.setLoading(btn, false);
    });
  });
</script>
</body>
</html>
