spring.application.name=KsinxAPP

#bind to the platform-provided port when present (Render/Heroku set $PORT), else 8080
server.port=${PORT:8080}

#DB_URL can be set directly, or assembled from discrete parts (Render exposes host/port/name separately)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:03202008}


# Email sending - "From" identity
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:LutorLMS}

# Verification token lifetime
app.mail.verification.expiry-hours=24

# Base URL used to build verification links in emails
app.base-url=${APP_BASE_URL:https://lutorlms.onrender.com}

#redis (used for @Cacheable course lookups)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=${CACHE_TYPE:redis}

#file uploads — all binaries (course media + student submissions) go to MinIO; see the `minio.*` block below.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

#schema is owned by Flyway; Hibernate only validates that entities match the migrated schema
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

#flyway
spring.flyway.enabled=true
#adopt databases that already have tables (e.g. created earlier by ddl-auto) instead of failing.
#the baseline marker sits at v1; the real schema is the idempotent V2 migration, so it always runs.
spring.flyway.baseline-on-migrate=true

#jwt — REQUIRED in production. If unset, an ephemeral dev key is generated at startup.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

#bootstrap admin: created on startup if no ADMIN exists. Leave email/password blank to skip.
app.admin.email=${ADMIN_EMAIL:admin@lutorlms.local}
app.admin.password=${ADMIN_PASSWORD:AdminChangeMe123}
app.admin.full-name=${ADMIN_FULL_NAME:Administrator}

#google oauth2 — OPTIONAL. OAuth login is auto-enabled only when these env vars are set:
#  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#(left out of this file on purpose: an empty client-id fails Spring Boot's OAuth2 validation.)

#paypal — OPTIONAL. Payment endpoints only work once these are set.
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

#actuator health (used by Render/Docker health checks). Redis is a lazy, non-critical cache,
#so exclude it from the aggregate to avoid false-negative health checks on free tiers.
management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
management.health.mail.enabled=false

#surface ResponseStatusException messages in error JSON so the client can show them
spring.web.error.include-message=always

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#minio — object storage for course media (public bucket) and student submissions (private bucket).
#endpoint    = internal URL the app uses to talk to MinIO (e.g. http://minio:9000 in compose)
#public-url  = browser-facing URL substituted into presigned links (so the SDK's internal hostname
#              is rewritten to something the user's browser can reach)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000/lutorlms-public}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:lutorlms}
minio.secret-key=${MINIO_SECRET_KEY:lutorlms-minio-secret}
minio.bucket-public=${MINIO_BUCKET_PUBLIC:lutorlms-public}
minio.bucket-private=${MINIO_BUCKET_PRIVATE:lutorlms-private}

debug=true