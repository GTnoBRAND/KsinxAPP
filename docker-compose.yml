name: lutorlms

services:
  db:
    image: postgres:16-alpine
    container_name: lutorlms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lutorlms}
      POSTGRES_USER:     ${POSTGRES_USER:-lutorlms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lutorlms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lutorlms} -d ${POSTGRES_DB:-lutorlms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lutorlms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${DOCKERHUB_USER:-gtnobrand}/lutorlms:${APP_TAG:-latest}
    container_name: lutorlms-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Infra (compose handles these) ──────────────────────
      DB_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB:-lutorlms}
      DB_USERNAME: ${POSTGRES_USER:-lutorlms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lutorlms}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      # Schema is owned by Flyway; Hibernate only validates. Override with DDL_AUTO if needed.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      # ── App secrets (set these in .env — no defaults are baked in) ──
      # If JWT_SECRET is empty the app generates an ephemeral key (tokens reset on restart).
      JWT_SECRET:          ${JWT_SECRET:-}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@lutorlms.local}
      ADMIN_PASSWORD:      ${ADMIN_PASSWORD:-AdminChangeMe123}
      # ── Optional PayPal (empty = payment endpoints disabled) ──
      PAYPAL_CLIENT_ID:    ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE:         ${PAYPAL_MODE:-sandbox}
      # ── Optional Google OAuth: uncomment and set both to enable social login ──
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_OPTS:           ${JAVA_OPTS:--Xms256m -Xmx768m}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads:
