name: lutorlms

services:
  db:
    image: postgres:16-alpine
    container_name: lutorlms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lutorlms}
      POSTGRES_USER:     ${POSTGRES_USER:-lutorlms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lutorlms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lutorlms} -d ${POSTGRES_DB:-lutorlms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lutorlms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    container_name: lutorlms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lutorlms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lutorlms-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot bootstrap: create the two buckets the app expects and make the
  # public one anonymously readable (so course cover photos / module teasers
  # render in the browser without a presigned URL).
  minio-init:
    image: minio/mc
    container_name: lutorlms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:       ${MINIO_ROOT_USER:-lutorlms}
      MINIO_ROOT_PASSWORD:   ${MINIO_ROOT_PASSWORD:-lutorlms-minio-secret}
      MINIO_BUCKET_PUBLIC:   ${MINIO_BUCKET_PUBLIC:-lutorlms-public}
      MINIO_BUCKET_PRIVATE:  ${MINIO_BUCKET_PRIVATE:-lutorlms-private}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET_PUBLIC || true &&
      mc mb -p local/$$MINIO_BUCKET_PRIVATE || true &&
      mc anonymous set download local/$$MINIO_BUCKET_PUBLIC || true
      "
    restart: "no"

  app:
    image: ${DOCKERHUB_USER:-gtnobrand}/lutorlms:${APP_TAG:-latest}
    container_name: lutorlms-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    environment:
      # ── Infra (compose handles these) ──────────────────────
      DB_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB:-lutorlms}
      DB_USERNAME: ${POSTGRES_USER:-lutorlms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lutorlms}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      # ── MinIO object storage ──────────────────────────────
      # endpoint = internal (container-to-container) URL the app uses to put/get objects.
      # public-url = browser-facing URL that presigned links are rewritten to. Override
      # both when fronting MinIO with a real domain (e.g. https://files.example.com).
      MINIO_ENDPOINT:       http://minio:9000
      MINIO_PUBLIC_URL:     ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY:     ${MINIO_ROOT_USER:-lutorlms}
      MINIO_SECRET_KEY:     ${MINIO_ROOT_PASSWORD:-lutorlms-minio-secret}
      MINIO_BUCKET_PUBLIC:  ${MINIO_BUCKET_PUBLIC:-lutorlms-public}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-lutorlms-private}
      # Schema is owned by Flyway; Hibernate only validates. Override with DDL_AUTO if needed.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      # ── App secrets (set these in .env — no defaults are baked in) ──
      # If JWT_SECRET is empty the app generates an ephemeral key (tokens reset on restart).
      JWT_SECRET:          ${JWT_SECRET:-}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@lutorlms.local}
      ADMIN_PASSWORD:      ${ADMIN_PASSWORD:-AdminChangeMe123}
      # ── SMTP / email (required for the verification email) ──
      MAIL_HOST:           ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:           ${MAIL_PORT:-587}
      MAIL_USERNAME:       ${MAIL_USERNAME:-}
      MAIL_PASSWORD:       ${MAIL_PASSWORD:-}
      MAIL_FROM:           ${MAIL_FROM:-}
      MAIL_FROM_NAME:      ${MAIL_FROM_NAME:-LutorLMS}
      APP_BASE_URL:        ${APP_BASE_URL:-http://localhost:8080}
      # ── Optional PayPal (empty = payment endpoints disabled) ──
      PAYPAL_CLIENT_ID:    ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE:         ${PAYPAL_MODE:-sandbox}
      # ── Optional Google OAuth: uncomment and set both to enable social login ──
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_OPTS:           ${JAVA_OPTS:--Xms256m -Xmx768m}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
  redisdata:
  miniodata:
